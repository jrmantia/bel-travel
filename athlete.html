<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Belgium Short Track — Athlete Travel &amp; Season Hub (Read-Only)</title>
<style>
  :root {
    --bg: #f8fafc;
    --surface: #ffffff;
    --border: #e2e8f0;
    --border-subtle: #f1f5f9;
    --text: #0f172a;
    --muted: #64748b;
    --primary: #0f172a;
    --green-bg: #ecfdf5;
    --green-text: #065f46;
    --green-border: #a7f3d0;
    --amber-bg: #fffbeb;
    --amber-text: #92400e;
    --amber-border: #fde68a;
    --red-bg: #fef2f2;
    --red-text: #991b1b;
    --red-border: #fecaca;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 13.5px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  header {
    background: #0f172a;
    color: #f8fafc;
    padding: 14px 24px;
    border-bottom: 1px solid #1e293b;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
  }
  header h1 { margin: 0; font-size: 16.5px; font-weight: 600; letter-spacing: -0.2px; color: #f8fafc; }
  header p { margin: 2px 0 0; color: #94a3b8; font-size: 12px; }
  .ro-pill {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.16);
    color: #e2e8f0;
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 11.5px;
    font-weight: 500;
  }
  .controls {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(8px);
    padding: 10px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .tabs {
    display: inline-flex;
    gap: 2px;
    flex-wrap: wrap;
    background: #f1f5f9;
    padding: 3px;
    border-radius: 8px;
    border: 1px solid #e2e8f0;
  }
  .tab-btn, .tab-btn-vehicles {
    border: none;
    background: transparent;
    color: #475569;
    padding: 6px 11px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 500;
    font-size: 12.5px;
    transition: all 0.12s;
  }
  .tab-btn:hover, .tab-btn-vehicles:hover { color: #0f172a; background: rgba(255,255,255,0.55); }
  .tab-btn.active, .tab-btn-vehicles.active {
    background: #ffffff;
    color: #0f172a;
    font-weight: 600;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
  }
  .filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  input[type="search"], select {
    padding: 6px 10px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    font-size: 12.5px;
    color: #0f172a;
    background: #ffffff;
  }
  select.athlete-picker {
    font-weight: 600;
    min-width: 210px;
  }
  main { padding: 18px 24px 48px; max-width: 1560px; margin: 0 auto; }
  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow-x: auto;
    box-shadow: 0 1px 2px rgba(15,23,42,0.03);
  }
  table { width: 100%; border-collapse: collapse; text-align: left; }
  th {
    background: #f8fafc;
    color: #475569;
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 9px 12px;
    border-bottom: 1px solid #cbd5e1;
    white-space: nowrap;
  }
  td { padding: 9px 12px; border-bottom: 1px solid var(--border-subtle); vertical-align: top; font-size: 13px; color: #1e293b; }
  tr:nth-child(even) td { background: transparent; }
  tr:hover td { background: #f8fafc; }
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 2px 7px;
    border-radius: 5px;
    font-size: 11.5px;
    font-weight: 600;
    white-space: nowrap;
  }
  .badge-pnr {
    background: #f1f5f9;
    color: #0f172a;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11.5px;
    font-weight: 600;
    border: 1px solid #e2e8f0;
    border-radius: 4px;
    padding: 1px 6px;
  }
  .badge-ok { background: var(--green-bg); color: var(--green-text); border: 1px solid var(--green-border); }
  .badge-warn { background: var(--amber-bg); color: var(--amber-text); border: 1px solid var(--amber-border); }
  .badge-crit { background: var(--red-bg); color: var(--red-text); border: 1px solid var(--red-border); }
  .badge-muted { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; font-weight: 500; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; font-variant-numeric: tabular-nums; }
  .btn-print, .btn-print-secondary {
    border: 1px solid #cbd5e1;
    background: #ffffff;
    color: #334155;
    padding: 6px 11px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 500;
    font-size: 12.5px;
  }
  .btn-print:hover, .btn-print-secondary:hover { background: #f8fafc; border-color: #94a3b8; color: #0f172a; }
  .vehicle-filter-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 14px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .v-subfilter-group {
    display: inline-flex;
    background: #f1f5f9;
    padding: 3px;
    border-radius: 7px;
    border: 1px solid #e2e8f0;
    gap: 2px;
  }
  .v-subfilter-btn {
    border: none;
    background: transparent;
    color: #475569;
    padding: 5px 11px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 500;
    transition: all 0.12s;
  }
  .v-subfilter-btn.active {
    background: #ffffff;
    color: #0f172a;
    font-weight: 600;
    box-shadow: 0 1px 2px rgba(15,23,42,0.06);
  }
  .vehicle-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 4px solid #10b981;
    border-radius: 10px;
    margin-bottom: 14px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(15,23,42,0.03);
  }
  .vehicle-card.health-CONFIRMED { border-left-color: #10b981; }
  .vehicle-card.health-WARNING_PENDING { border-left-color: #f59e0b; }
  .vehicle-card.health-CRITICAL_UNBOOKED { border-left-color: #ef4444; }
  .vehicle-card.health-COMPLETED { border-left-color: #94a3b8; opacity: 0.86; }
  .vehicle-card-header {
    padding: 14px 18px;
    background: #ffffff;
    border-bottom: 1px solid var(--border-subtle);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
  }
  .v-primary-line {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
  }
  .v-date-text { font-size: 15px; font-weight: 700; color: #0f172a; letter-spacing: -0.2px; }
  .v-countdown-badge {
    background: #f1f5f9;
    color: #475569;
    font-weight: 600;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
  }
  .v-sep { color: #cbd5e1; }
  .v-time-text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13.5px; font-weight: 600; color: #0f172a; }
  .v-route-text { font-size: 14.5px; font-weight: 600; color: #0f172a; }
  .v-flight-chip {
    background: #f1f5f9;
    color: #0f172a;
    border: 1px solid #e2e8f0;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 5px;
  }
  .v-subtitle-line {
    margin-top: 4px;
    font-size: 12px;
    color: #64748b;
  }
  .v-pnr-box {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
  }
  .pnr-copy-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: #f8fafc;
    border: 1px solid #cbd5e1;
    color: #0f172a;
    padding: 4px 9px;
    border-radius: 6px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .pnr-copy-pill:hover { background: #f1f5f9; border-color: #94a3b8; }
  .tkt-copy-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: transparent;
    border: 1px solid transparent;
    color: #0f172a;
    padding: 2px 6px;
    margin-left: -6px;
    border-radius: 4px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
  }
  .tkt-copy-btn:hover { background: #f1f5f9; border-color: #cbd5e1; }
  .vehicle-card table th {
    background: #fafafa;
    color: #64748b;
    font-size: 10.5px;
    padding: 7px 14px;
    border-bottom: 1px solid #e2e8f0;
  }
  .vehicle-card table td {
    padding: 7px 14px;
    font-size: 12.5px;
    border-bottom: 1px solid #f1f5f9;
  }
  .vehicle-card table tr:last-child td { border-bottom: none; }
  tr.pax-highlight td { background: #fefce8 !important; }
  tr.pax-highlight td:first-child { border-left: 3px solid #eab308; }
  .print-banner {
    display: none;
    background: #f8fafc;
    border: 1px solid #cbd5e1;
    border-left: 4px solid #0f172a;
    padding: 8px 14px;
    margin-bottom: 12px;
    font-size: 12px;
    font-weight: 600;
    color: #0f172a;
  }
  .hidden { display: none !important; }
  /* Security Lock Screen (PIN + Biometric WebAuthn) */
  .lock-screen {
    position: fixed;
    inset: 0;
    background: #ffffff;
    z-index: 10000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 20px;
  }
  .lock-screen.hidden { display: none !important; }
  .lock-logo {
    width: 56px;
    height: 56px;
    border-radius: 16px;
    background: #0f172a;
    border: 2px solid #eab308;
    color: #f8fafc;
    font-weight: 800;
    font-size: 16px;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 20px rgba(15, 23, 42, 0.18);
    margin-bottom: 16px;
  }
  .lock-title { font-size: 20px; font-weight: 700; color: #0f172a; margin: 0 0 6px; text-align: center; }
  .lock-sub { font-size: 13px; color: #64748b; margin: 0 0 24px; text-align: center; max-width: 300px; line-height: 1.4; }
  .pin-dots { display: flex; gap: 16px; margin-bottom: 28px; }
  .pin-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 2px solid #cbd5e1;
    background: transparent;
    transition: all 0.15s ease;
  }
  .pin-dot.filled { background: #0f172a; border-color: #0f172a; transform: scale(1.08); }
  .pin-dot.error { background: #ef4444; border-color: #ef4444; }
  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 76px);
    gap: 14px;
    justify-content: center;
  }
  .key-btn {
    width: 76px;
    height: 64px;
    border-radius: 16px;
    border: 1px solid #e2e8f0;
    background: #f8fafc;
    color: #0f172a;
    font-size: 22px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    transition: background 0.1s ease, transform 0.08s ease;
  }
  .key-btn:active { background: #e2e8f0; transform: scale(0.96); }
  .key-btn.key-sub { font-size: 12px; font-weight: 700; color: #64748b; }
  .key-btn.key-bio { font-size: 12px; font-weight: 700; color: #0f172a; border-color: #cbd5e1; background: #f1f5f9; }
  .hdr-action-btn {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.18);
    color: #f8fafc;
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .hdr-action-btn:hover { background: rgba(255,255,255,0.16); }
  @media (max-width: 768px) {
    header { padding: 12px 14px; gap: 10px; }
    header h1 { font-size: 15px; }
    header p { font-size: 11px; }
    .stats-row {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      padding-top: 6px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    .stat-pill { border-left: none; padding-left: 0; }
    .controls { padding: 8px 12px; gap: 8px; }
    .tabs {
      width: 100%;
      overflow-x: auto;
      flex-wrap: nowrap;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab-btn, .tab-btn-vehicles, .tab-btn-urgent { white-space: nowrap; flex-shrink: 0; padding: 6px 10px; font-size: 12px; }
    .filters { width: 100%; }
    .filters select, .filters input[type="search"] { flex: 1; min-width: 130px; }
    main { padding: 12px 10px 40px; }
    .vehicle-card-header { padding: 12px 14px; gap: 10px; }
    .v-pnr-box { width: 100%; justify-content: flex-start; }
  }
  @media print {
    @page { size: landscape; margin: 7mm; }
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    body { background: #ffffff !important; font-size: 10px !important; }
    header { padding: 10px 16px !important; border-bottom-width: 1px !important; }
    header h1 { font-size: 15px !important; }
    header p { font-size: 10.5px !important; }
    .controls, .no-print { display: none !important; }
    .print-banner { display: block !important; }
    main { padding: 8px 0 0 0 !important; max-width: 100% !important; }
    .table-wrap { overflow: visible !important; border: none !important; box-shadow: none !important; }
    table { width: 100% !important; table-layout: auto !important; font-size: 9.5px !important; }
    th { position: static !important; padding: 5px 6px !important; font-size: 8.5px !important; white-space: normal !important; }
    td { padding: 4px 6px !important; font-size: 9.5px !important; word-break: break-word !important; }
    tr, .vehicle-card { break-inside: avoid; page-break-inside: avoid; }
    thead { display: table-header-group; }
    body.print-all-mode .view-section { display: block !important; page-break-after: always; margin-bottom: 20px; }
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>Team Belgium Short Track — Athlete Travel &amp; Season Hub</h1>
    <p>Flights, Booking Codes (PNRs), Hotels &amp; Rooming, Equipment Rules &amp; 2026/27 Season Schedule</p>
  </div>
  <div class="ro-pill">Read-Only Athlete Edition</div>
</header>

<div class="controls">
  <div class="tabs">
    <button class="tab-btn active" data-tab="matrix" onclick="switchTab('matrix', this)">Trip Overview</button>
    <button class="tab-btn tab-btn-vehicles" data-tab="vehicles" onclick="switchTab('vehicles', this)">Tickets by Vehicle</button>
    <button class="tab-btn" data-tab="legs" onclick="switchTab('legs', this)">Flights &amp; Trains</button>
    <button class="tab-btn" data-tab="hotels" onclick="switchTab('hotels', this)">Hotels &amp; Rooming</button>
    <button class="tab-btn" data-tab="reminders" onclick="switchTab('reminders', this)">Reminders &amp; Rules</button>
    <button class="tab-btn" data-tab="isurules" onclick="switchTab('isurules', this)">ISU Rules</button>
    <button class="tab-btn" data-tab="roster" onclick="switchTab('roster', this)">Frequent Flyer &amp; Passports</button>
  </div>
  <div class="filters">
    <select id="personFilter" class="athlete-picker" onchange="renderActive()">
      <option value="">All Athletes &amp; Staff (Filter by Name)</option>
      <option value="Joey Mantia">Joey Mantia (Head Coach)</option>
      <option value="Matt Zukowski">Matt Zukowski (Assistant Coach)</option>
      <option value="Mengyao (Maggie) Qi">Mengyao (Maggie) Qi (Team Leader)</option>
      <option value="Jeremy Kozuback">Jeremy Kozuback (Physiotherapist (Asia))</option>
      <option value="Martin Zacharias">Martin Zacharias (Physiotherapist (WT1/WT2))</option>
      <option value="Hanne Desmet">Hanne Desmet (Athlete (F))</option>
      <option value="Tineke Den Dulk">Tineke Den Dulk (Athlete (F))</option>
      <option value="Stijn Desmet">Stijn Desmet (Athlete (M))</option>
      <option value="Adriaan Dewagtere">Adriaan Dewagtere (Athlete (M))</option>
      <option value="Warre Noiron">Warre Noiron (Athlete (M))</option>
      <option value="Ward Petre">Ward Petre (Athlete (M))</option>
      <option value="Enzo Proost">Enzo Proost (Athlete (M))</option>
      <option value="Aleyandro Rivero Maerschalck">Aleyandro Rivero Maerschalck (Athlete (M))</option>
      <option value="Fre Van Damme">Fre Van Damme (Athlete (M))</option>
      <option value="Warre Van Damme">Warre Van Damme (Athlete (M))</option>
    </select>
    <input type="search" id="searchBox" placeholder="Search flight, PNR, hotel, rule..." oninput="renderActive()">
    <button class="btn-print" onclick="printCurrentTab()" title="Print or Save the currently active tab as a landscape PDF">Print Tab</button>
    <button class="btn-print-secondary" onclick="printAllTabs()" title="Print or Save all tabs at once as a multi-section PDF">Print All</button>
  </div>
</div>

<main>
  <div id="printBanner" class="print-banner"></div>
  <div id="view-matrix" class="view-section"></div>
  <div id="view-vehicles" class="view-section hidden"></div>
  <div id="view-legs" class="view-section hidden"></div>
  <div id="view-hotels" class="view-section hidden"></div>
  <div id="view-reminders" class="view-section hidden"></div>
  <div id="view-isurules" class="view-section hidden"></div>
  <div id="view-roster" class="view-section hidden"></div>
</main>

let currentTab = 'matrix';

function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function highlightPNR(text) {
  let t = esc(text);
  t = t.replace(/\b(CHTL8O|KSQRPL|AZYECP|QZPCLF|CE5MDM|CE72IU|XW2ETT|CM352A|PB0DFM|29ABQ2|NJXWKL|A44X7U|CVCZDA|DZMDNX|CVDH3J|LEGGOJ|AM4K3G|2PFJ9Q|ZLIL9N|ZLPFB2|XNZ4IK|Y5524F|YLPZHC|10WT2Mon)\b/g, '<span class="badge-pnr">$1</span>');
  t = t.replace(/\b(ACTION NEEDED|URGENT|VISA CHECK)\b/gi, '<span class="badge badge-crit">$1</span>');
  t = t.replace(/\b(PENDING)\b/gi, '<span class="badge badge-warn">$1</span>');
  t = t.replace(/(https:\/\/forms\.gle\/[a-zA-Z0-9_-]+)/g, '<a href="$1" target="_blank" rel="noopener" style="color:#0f172a;font-weight:600;">Open Form</a>');
  return t;
}

function formatCalmRelLabel(rel) {
  const s = String(rel || '');
  if (s.includes('TODAY')) return 'Today';
  if (s.includes('TOMORROW')) return 'Tomorrow';
  const m = s.match(/IN\s+(\d+)\s+DAYS/i);
  if (m) return `In ${m[1]}d`;
  if (s.includes('COMPLETED')) return 'Completed';
  return s.trim();
}

function formatCalmBaggage(seatStr, bagStr) {
  const seat = (seatStr && seatStr !== '—' && seatStr !== 'TBD')
    ? `<span class="mono" style="font-weight:600; color:#0f172a; margin-right:6px;">Seat ${esc(seatStr)}</span>`
    : '';
  const b = String(bagStr || '').replace(/!!+/g, '').trim();
  let noteHtml = '';
  if (/bike/i.test(b)) {
    noteHtml = `<span class="badge badge-warn">${esc(b)}</span>`;
  } else if (/2 Checked Bags Included/i.test(b)) {
    noteHtml = `<span style="color:#64748b;">2 bags</span>`;
  } else if (/1 Checked Bag Included/i.test(b)) {
    noteHtml = `<span style="color:#64748b;">1 bag</span>`;
  } else if (b && b !== '—' && b !== 'Standard') {
    noteHtml = `<span style="color:#64748b;">${esc(b)}</span>`;
  }
  return (seat + noteHtml) || '<span style="color:#94a3b8;">—</span>';
}

function switchTab(tab, btn) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  document.querySelectorAll('.view-section').forEach(s => s.classList.add('hidden'));
  document.getElementById('view-' + tab).classList.remove('hidden');
  renderActive();
}

function matchesFilter(rowObj, q, person) {
  const str = JSON.stringify(rowObj).toLowerCase();
  if (q && !str.includes(q)) return false;
  if (person) {
    const pLow = person.toLowerCase();
    const firstName = pLow.split(' ')[0];
    if (!str.includes(pLow) && !str.includes(firstName)) return false;
  }
  return true;
}

function renderActive() {
  const q = document.getElementById('searchBox').value.trim().toLowerCase();
  const person = document.getElementById('personFilter').value;

  if (currentTab === 'matrix') {
    const rows = DATA.personMatrix.filter(r => (!person || r.Traveler === person) && matchesFilter(r, q, ''));

    for (const c of cols) html += `<th>${esc(c)}</th>`;
    html += '</tr></thead><tbody>';
    for (const r of rows) {
      html += '<tr>';
      cols.forEach((c, idx) => {
        html += idx === 0 ? `<td><strong>${esc(r[c])}</strong></td>` : `<td>${highlightPNR(r[c])}</td>`;

      html += '</tr>';

    html += '</tbody></table></div>';
    document.getElementById('view-matrix').innerHTML = html;
  }

  if (currentTab === 'vehicles') {

    const upcomingAll = allClusters.filter(v => v.Timing_Group === 'UPCOMING').sort((a, b) => (a.Order_Index || 99) - (b.Order_Index || 99));

    let html = `<div class="vehicle-filter-bar no-print">
      <div class="v-subfilter-group">
        <button class="v-subfilter-btn ${!showPast ? 'active' : ''}" onclick="window.__athleteShowPastVeh = false; renderActive();">Upcoming Trips (${upcomingAll.length})</button>
        <button class="v-subfilter-btn ${showPast ? 'active' : ''}" onclick="window.__athleteShowPastVeh = true; renderActive();">Include Past Trips (+${pastAll.length})</button>
      </div>
      <div style="font-size:12px; color:#64748b;">Select your name in the top-right dropdown to filter to your flights &amp; highlight your row</div>
    </div>`;

    let shownPastBanner = false;
    filteredClusters.forEach(vc => {
      if (vc.Timing_Group === 'PAST' && !shownPastBanner) {
        shownPastBanner = true;
        html += `<div style="font-weight:600; font-size:12px; text-transform:uppercase; padding:8px 14px; background:#f8fafc; border:1px solid #e2e8f0; border-left:4px solid #64748b; border-radius:8px; margin:20px 0 10px; color:#475569;">Completed / Past Flights (Jul 2 – Oct 29, 2026)</div>`;
      }
      const pnrPillsHtml = (vc.PNR_Codes && vc.PNR_Codes.length)
        ? vc.PNR_Codes.map(code => `<button class="pnr-copy-pill" onclick="copyToClipboard('${esc(code)}', this)">PNR: ${esc(code)} <span style="color:#94a3b8; font-weight:400; font-size:10px;">(Copy)</span></button>`).join(' ')
        : `<span class="badge badge-warn">Being Finalized</span>`;

      html += `<div class="vehicle-card health-${vc.Booking_Health}">
        <div class="vehicle-card-header">
          <div>
            <div class="v-primary-line">
              <span class="v-date-text">${esc(vc.Display_Date)}</span>
              <span class="v-countdown-badge">${esc(formatCalmRelLabel(vc.Relative_Label))}</span>
              <span class="v-sep">&middot;</span>
              <span class="v-time-text">${esc(vc.Dep_Time)} &rarr; ${esc(vc.Arr_Time)}</span>
              <span class="v-sep">&middot;</span>
              <span class="v-route-text">${esc(vc.Route)}</span>
              <span class="v-flight-chip">${esc(vc.Flight_Train_No)}</span>
            </div>
            <div class="v-subtitle-line">
              ${esc(vc.Airline_Operator)} &middot; ${esc(vc.Phase)} &middot; ${vc.Pax_Count} ${vc.Pax_Count === 1 ? 'Traveler' : 'Travelers'}
            </div>
          </div>
          <div class="v-pnr-box">
            ${pnrPillsHtml}
          </div>
        </div>
        <div class="table-wrap" style="border:none; border-radius:0; box-shadow:none;">
          <table>
            <thead>
              <tr>
                <th style="width:36px;">#</th>
                <th style="width:24%;">Traveler</th>
                <th style="width:22%;">Legal Ticket Name</th>
                <th style="width:16%;">Booking Code (PNR)</th>
                <th style="width:20%;">13-Digit Ticket #</th>
                <th>Seat &amp; Baggage</th>
              </tr>
            </thead>
            <tbody>`;
      (vc.Passengers || []).forEach((p, pIdx) => {
        const hi = person && p.Traveler === person;
        const canCopyTkt = p.Ticket_Number && /\d{10,14}/.test(p.Ticket_Number);
        const tktHtml = canCopyTkt
          ? `<button class="tkt-copy-btn" onclick="copyToClipboard('${esc(p.Ticket_Number)}', this)">${esc(p.Ticket_Number)} <span style="color:#94a3b8; font-size:10px;">(Copy)</span></button>`
          : `<span class="mono" style="color:#64748b;">${esc(p.Ticket_Number)}</span>`;
        html += `<tr class="${hi ? 'pax-highlight' : ''}">
          <td class="mono" style="color:#94a3b8;">${pIdx + 1}</td>
          <td><strong style="color:#0f172a;">${esc(p.Traveler)}</strong> <span style="color:#94a3b8; font-size:12px; margin-left:4px;">${esc(p.Role)}</span></td>
          <td class="mono" style="font-size:11.5px; color:#64748b;">${esc(p.Legal_Name)}</td>
          <td class="mono" style="font-weight:600; color:#0f172a;">${esc(p.Airline_PNR)}</td>
          <td>${tktHtml}</td>
          <td>${formatCalmBaggage(p.Seat, p.Baggage)}</td>
        </tr>`;
      });
      html += `</tbody></table></div></div>`;
    });
    document.getElementById('view-vehicles').innerHTML = html;
  }

  if (currentTab === 'legs') {
    const rows = DATA.masterFlights.filter(r => (!person || r.Traveler === person) && matchesFilter(r, q, ''));
    let html = '<div class="table-wrap"><table><thead><tr>' +
      '<th>Phase</th><th>Date</th><th>Traveler</th><th>Airline</th><th>Flight #</th>' +
      '<th>Route</th><th>Time</th><th>Booking Code (PNR)</th><th>Ticket #</th><th>Seat</th><th>Baggage</th><th>Status</th>' +
      '</tr></thead><tbody>';
    for (const r of rows) {
      html += `<tr>
        <td>${esc(r.Phase)}</td>
        <td style="white-space:nowrap"><strong>${esc(r.Date)}</strong></td>
        <td><strong>${esc(r.Traveler)}</strong></td>
        <td>${esc(r.Airline)}</td>
        <td class="mono"><strong>${esc(r.Flight_No)}</strong></td>
        <td style="white-space:nowrap"><strong>${esc(r.Route)}</strong></td>
        <td style="white-space:nowrap">${esc(r.Dep_Time)} &rarr; ${esc(r.Arr_Time)}</td>
        <td>${highlightPNR(r.Airline_PNR)}</td>
        <td class="mono">${esc(r.Ticket_Number)}</td>
        <td class="mono"><strong>${esc(r.Seat)}</strong></td>
        <td>${esc(r.Baggage)}</td>
        <td>${highlightPNR(r.Status)}</td>
      </tr>`;
    }
    html += '</tbody></table></div>';
    document.getElementById('view-legs').innerHTML = html;
  }

  if (currentTab === 'hotels') {
    const rows = DATA.hotelsLogistics.filter(r => matchesFilter(r, q, person));
    let html = '<div class="table-wrap"><table><thead><tr>' +
      '<th>Event / Phase</th><th>Category</th><th>Hotel / Carrier</th><th>Check-In</th><th>Check-Out</th>' +
      '<th>Rooming List &amp; Roommates</th><th>Meals &amp; Weight Room Info</th><th>Status</th>' +
      '</tr></thead><tbody>';
    for (const r of rows) {
      html += `<tr>
        <td><strong>${esc(r.Event_Phase)}</strong></td>
        <td><strong>${esc(r.Category)}</strong></td>
        <td><strong>${esc(r.Property_Vendor)}</strong></td>
        <td style="white-space:nowrap">${esc(r.Check_In)}</td>
        <td style="white-space:nowrap">${esc(r.Check_Out)}</td>
        <td>${highlightPNR(r.Rooming_Details)}</td>
        <td>${esc(r.Meals_Services)}</td>
        <td><span class="badge badge-ok">${esc(r.Status)}</span></td>
      </tr>`;
    }
    html += '</tbody></table></div>';
    document.getElementById('view-hotels').innerHTML = html;
  }

  if (currentTab === 'reminders') {
    const rows = DATA.reminders.filter(r => matchesFilter(r, q, ''));
    let html = '<div class="table-wrap"><table><thead><tr>' +
      '<th>Priority</th><th>Category</th><th>Date / Deadline</th><th>Reminder / Rule</th><th>Details &amp; Action</th><th>Status</th>' +
      '</tr></thead><tbody>';
    for (const a of rows) {
      html += `<tr>
        <td>${highlightPNR(a.Priority)}</td>
        <td><strong>${esc(a.Category)}</strong></td>
        <td style="white-space:nowrap"><strong>${esc(a.Target_Date)}</strong></td>
        <td><strong>${esc(a.Item)}</strong></td>
        <td>${highlightPNR(a.Details)}</td>
        <td>${highlightPNR(a.Status)}</td>
      </tr>`;
    }
    html += '</tbody></table></div>';
    document.getElementById('view-reminders').innerHTML = html;
  }

  if (currentTab === 'isurules') {
    const rows = DATA.isuRulesQuotas.filter(r => matchesFilter(r, q, ''));
    let html = '<div class="table-wrap"><table><thead><tr>' +
      '<th>Section</th><th>Event / 2026-27 Rule</th><th>Dates / Venue</th>' +
      '<th>Belgium Quota / Rule Scope</th><th>500m Qualifying Time / Sanction</th><th>Key Rules &amp; Deadlines</th>' +
      '</tr></thead><tbody>';
    for (const r of rows) {
      html += `<tr>
        <td><strong>${esc(r.Section)}</strong></td>
        <td><strong>${esc(r.Topic_Event)}</strong></td>
        <td>${esc(r.Dates_Location)}</td>
        <td><strong>${highlightPNR(r.Belgium_Quota_Target)}</strong></td>
        <td class="mono">${highlightPNR(r.Qualifying_Time_500m)}</td>
        <td>${highlightPNR(r.Key_Rules_Deadlines)}</td>
      </tr>`;
    }
    html += '</tbody></table></div>';
    document.getElementById('view-isurules').innerHTML = html;
  }

  if (currentTab === 'roster') {
    const rows = DATA.roster.filter(r => (!person || r.name === person) && matchesFilter(r, q, ''));
    let html = '<div class="table-wrap"><table><thead><tr>' +
      '<th>Name</th><th>Legal Ticket Name</th><th>Role</th><th>Nationality</th>' +
      '<th>Passport (Masked)</th><th>Passport Expiry</th><th>Frequent Flyer #</th><th>Home Airport</th>' +
      '</tr></thead><tbody>';
    for (const r of rows) {
      html += `<tr>
        <td><strong>${esc(r.name)}</strong></td>
        <td class="mono">${esc(r.legal_name)}</td>
        <td>${esc(r.role)}</td>
        <td><strong>${esc(r.nationality)}</strong></td>
        <td class="mono">${esc(r.passport_masked)}</td>
        <td class="mono">${highlightPNR(r.passport_expiry)}</td>
        <td class="mono">${esc(r.frequent_flyer)}</td>
        <td>${esc(r.home_airport)}</td>
      </tr>`;
    }
    html += '</tbody></table></div>';
    document.getElementById('view-roster').innerHTML = html;
  }
}

const ATHLETE_TAB_LABELS = {
  matrix: '1. Athlete Trip Overview (Person-by-Person)',
  vehicles: 'Tickets by Vehicle (Clustered Closest Departure First)',
  legs: '2. Flights & Trains Schedule',
  hotels: '3. Hotels, Rooming Lists & Weight Room Info',
  reminders: '4. Athlete Reminders & On-Site Rules',
  isurules: '5. 2026/27 Season Schedule, Quotas & ISU Rules',
  roster: '6. Frequent Flyer #s & Passport Expiry'
};

function copyToClipboard(text, btnEl) {
  if (navigator.clipboard) navigator.clipboard.writeText(text);
  if (btnEl) {
    const orig = btnEl.innerHTML;
    btnEl.innerHTML = 'Copied: ' + esc(text);
    setTimeout(() => { btnEl.innerHTML = orig; }, 1400);
  }
}

function updatePrintBanner(labelOverride) {
  const person = document.getElementById('personFilter').value;
  const q = document.getElementById('searchBox').value.trim();
  const baseLabel = labelOverride || ATHLETE_TAB_LABELS[currentTab] || currentTab;
  let extra = [];
  if (person) extra.push('Athlete: ' + person);
  if (q) extra.push('Search: "' + q + '"');
  document.getElementById('printBanner').textContent =
    'ATHLETE READ-ONLY EDITION — ' + baseLabel + (extra.length ? ' (' + extra.join(' | ') + ')' : '') + ' • Team Belgium Short Track (2026/27)';
}

function printCurrentTab() {
  const origTitle = document.title;
  const person = document.getElementById('personFilter').value;
  const cleanTabName = (ATHLETE_TAB_LABELS[currentTab] || currentTab).replace(/[^a-zA-Z0-9_-]+/g, '_');
  const cleanPerson = person ? ('_' + person.replace(/[^a-zA-Z0-9_-]+/g, '_')) : '';
  document.title = 'Team_Belgium_Athlete_' + cleanTabName + cleanPerson;
  updatePrintBanner();
  window.print();
  document.title = origTitle;
}

function printAllTabs() {
  const origTitle = document.title;
  const savedTab = currentTab;
  document.title = 'Team_Belgium_Athlete_Hub_All_Sections';
  for (const t of Object.keys(ATHLETE_TAB_LABELS)) {
    currentTab = t;
    renderActive();
  }
  currentTab = savedTab;
  updatePrintBanner('ALL SECTIONS (1–6 Complete Athlete Read-Only Pack)');
  document.body.classList.add('print-all-mode');
  window.print();
  document.body.classList.remove('print-all-mode');
  document.title = origTitle;
  renderActive();
}

(function initFromQuery() {
  const params = new URLSearchParams(window.location.search);
  const p = params.get('person');
  if (p) {
    const sel = document.getElementById('personFilter');
    if (sel) sel.value = p;
  }
  const t = params.get('tab');
  if (t && ATHLETE_TAB_LABELS[t]) {
    const btn = document.querySelector(`.tab-btn[data-tab="${t}"]`);
    switchTab(t, btn);
    updatePrintBanner();
  } else {
    renderActive();
    updatePrintBanner();
  }
})();
</script>
